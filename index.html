<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Scene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Renderer ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d3d);
    scene.fog = new THREE.Fog(0x0a0a0f, 8, 25);

    // ── Camera ────────────────────────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(3, 2, 4);
    camera.lookAt(0, 0.5, 0);

    // ── Orbit Controls ────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 0.3, 0);
    controls.minDistance = 0.5;
    controls.maxDistance = 20;
    controls.update();

    // ─────────────────────────────────────────────
//  SHADER — procedural stripe material
// ─────────────────────────────────────────────
const vertexShader = /* glsl */`
  varying vec2 vUv;
  varying vec3 vNormal;
  varying vec3 vViewPos;

  void main() {
    vUv     = uv;
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vViewPos   = -mvPos.xyz;
    gl_Position = projectionMatrix * mvPos;
  }
`;

const fragmentShader = /* glsl */`
  uniform float uOffset;

  varying vec2  vUv;
  varying vec3  vNormal;
  varying vec3  vViewPos;

  const vec3  COLOR_A      = vec3(0.353, 0.337, 0.275);  // #201f1f
  const vec3  COLOR_B      = vec3(0.227, 0.220, 0.216);  // #090e14
  const float STRIPE_COUNT = 1.5;

  // ── Classic 2-D Perlin noise ──────────────────────────────────────────
  vec2 fade(vec2 t) { return t * t * t * (t * (t * 6.0 - 15.0) + 10.0); }

  float grad(float h, vec2 p) {
    h = mod(floor(h), 4.0);
    if (h < 1.0) return  p.x + p.y;
    if (h < 2.0) return -p.x + p.y;
    if (h < 3.0) return  p.x - p.y;
                 return -p.x - p.y;
  }

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
  }

  float perlin(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = fade(f);
    float a = hash(i + vec2(0.0, 0.0));
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    float ga = grad(a * 4.0, f - vec2(0.0, 0.0));
    float gb = grad(b * 4.0, f - vec2(1.0, 0.0));
    float gc = grad(c * 4.0, f - vec2(0.0, 1.0));
    float gd = grad(d * 4.0, f - vec2(1.0, 1.0));
    return mix(mix(ga, gb, u.x), mix(gc, gd, u.x), u.y);
  }

  // fBm — two octaves for detail
  float fbm(vec2 p) {
    return perlin(p) * 0.6 + perlin(p * 2.1) * 0.4;
  }
  // ─────────────────────────────────────────────────────────────────────

  void main() {
    // ── stripe colour ─────────────────────────────────────────────────
    float v = fract(vUv.x * STRIPE_COUNT + uOffset);
    float t = 0.5 + 0.5 * sin(v * 6.2831853);
    vec3 stripeColor = mix(COLOR_A, COLOR_B, t);

    // ── Perlin roughness — offset in Y at same rate as stripes ────────
    vec2 noiseUv = vec2(vUv.x * 4.0 + uOffset * STRIPE_COUNT, vUv.y * 4.0);
    float noise  = fbm(noiseUv);
    float rough  = clamp(0.55 + noise * 0.5, 0.1, 1.0);

    // ── lighting ──────────────────────────────────────────────────────
    vec3 N = normalize(vNormal);
    vec3 V = normalize(vViewPos);

    vec3  L1     = normalize(vec3(-0.55, 0.72, 0.42));
    float diff1  = max(dot(N, L1), 0.0);
    vec3  H1     = normalize(L1 + V);
    float shine1 = mix(128.0, 4.0, rough);
    float spec1  = pow(max(dot(N, H1), 0.0), shine1) * mix(0.6, 0.05, rough);

    vec3  L2     = normalize(vec3(0.62, 0.60, -0.49));
    float diff2  = max(dot(N, L2), 0.0) * 0.6;
    vec3  H2     = normalize(L2 + V);
    float shine2 = mix(128.0, 4.0, rough);
    float spec2  = pow(max(dot(N, H2), 0.0), shine2) * mix(0.4, 0.03, rough);

    vec3 lit = stripeColor * (diff1 + diff2) + vec3(spec1 + spec2);

    gl_FragColor = vec4(lit, 1.0);
  }
`;

/*

    // ── Ground Plane  (16 m wide × 3 m long) ─────────────────────────────────
    const groundGeo = new THREE.PlaneGeometry(16, 3);
    const planeMat = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
      uOffset: { value: 0.0 }
    },
    side: THREE.DoubleSide
    });
    const ground = new THREE.Mesh(groundGeo, planeMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
*/
    // ── Ground Plane 02 (16 m wide × 4 m long) ─────────────────────────────────

    const texPLane = new THREE.PlaneGeometry(16, 4);
    const texLoader = new THREE.TextureLoader();
    const streetmap = texLoader.load('https://raw.githubusercontent.com/510home/iso-night-drive/main/tex/asphalt01x.jpg', (tex01) => {  
      tex01.wrapS = tex01.wrapT = THREE.RepeatWrapping;
     tex01.repeat.set(2, 1);
    });  

    
    const streetMat = new THREE.MeshStandardMaterial ({
      metalness: 0.2,
      roughness: 0.5,
      map: streetmap,
      side: THREE.DoubleSide,
    });
    
    const plane02tex = new THREE.Mesh(texPLane, streetMat);
    
    plane02tex.rotation.x = -Math.PI / 2;
    plane02tex.receiveShadow = true;
    plane02tex.position.set(0, -0.3, -1);
    scene.add(plane02tex);
    
    // subtle grid lines on the ground ───────────────────────────────
    const gridHelper = new THREE.GridHelper(16, 32, 0x2a2a3a, 0x2a2a3a);
    gridHelper.position.y = 0.001;
    scene.add(gridHelper);

    // ── Ambient Light ─────────────────────────────────────────────────────────
    const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.02);
    scene.add(ambientLight);

    // ── Hemisphere Light ──────────────────────────────────────────────────────
//    const hemiLight = new THREE.HemisphereLight(0x334466, 0x0a0a0f, 0.2);
//    scene.add(hemiLight);

    // ── Spotlight  xPos=2.0, yPos=2.0, zPos=1.0 ──────────────────────────────
    const spotlight = new THREE.SpotLight(0xfff4e0, 10, 15, 10, 0.25);
    spotlight.position.set(4.0, 2.0, 1.0);
    spotlight.target.position.set(0, 0, 0.5);
    spotlight.castShadow = true;
    spotlight.shadow.mapSize.width  = 1024;
    spotlight.shadow.mapSize.height = 1024;
    spotlight.shadow.camera.near = 0.2;
    spotlight.shadow.camera.far  = 12;
    spotlight.shadow.bias = -0.001;
    scene.add(spotlight);
    scene.add(spotlight.target);

    // ── GLTF Loader ───────────────────────────────────────────────────────────
    const loader = new GLTFLoader();

    function loadModel(url, x, y, z) {
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          (gltf) => {
            const model = gltf.scene;
            model.position.set(x, y, z);
            // enable shadows on every mesh
            model.traverse((child) => {
              if (child.isMesh) {
                child.castShadow    = true;
                child.receiveShadow = true;
              }
            });
            scene.add(model);
            resolve(model);
          },
          undefined,
          reject
        );
      });
    }

    // Model 1 – car body (single instance)
    loadModel(
      'https://raw.githubusercontent.com/510home/iso-night-drive/main/models/lancer_1x_nowheels.glb',
      -0.07, 0.07, -0.55
    ).catch(console.error);
    

    // Model 2 – Front Wheel
    const wheelFront = await loadModel(
      'https://raw.githubusercontent.com/510home/iso-night-drive/main/models/wheels_1x_02.glb',
       .985, 0.2, -0.525
    ).catch(console.error);
    scene.add(wheelFront);

    // Model 3 - Back Wheel
    const wheelBack = await loadModel(
      'https://raw.githubusercontent.com/510home/iso-night-drive/master/models/wheels_1x_02.glb',
      -0.72, 0.2, -0.525
    ).catch(console.error);
    scene.add(wheelBack);

    // ── Resize handler ────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop ───────────────────────────────────────────────────────────
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (wheelFront) wheelFront.rotation.z = t * Math.PI * 2 * 24;
      if (wheelBack)  wheelBack.rotation.z  = t * Math.PI * 2 * 24;

      const yOffset = (t * 4.0) % 1.0;
  //    streetMat.uniforms.uOffset.value = yOffset;
     if (streetmap) streetmap.offset.x = t * 12.0;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
