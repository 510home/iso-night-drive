<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Scene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Renderer ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x002222);
    scene.fog = new THREE.Fog(0x0a0a0f, 8, 25);

    // ── Camera ────────────────────────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(3, 2, 4);
    camera.lookAt(0, 0.5, 0);

    // ── Orbit Controls ────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 0.3, 0);
    controls.minDistance = 0.5;
    controls.maxDistance = 20;
    controls.update();

    // ── Ground Plane  (16 m wide × 3 m long) ─────────────────────────────────
    const groundGeo = new THREE.PlaneGeometry(16, 3);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a22,
      roughness: 0.65,
      metalness: 0.6,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // subtle grid lines on the ground
    const gridHelper = new THREE.GridHelper(16, 32, 0x2a2a3a, 0x2a2a3a);
    gridHelper.position.y = 0.001;
    scene.add(gridHelper);

    // ── Ambient Light ─────────────────────────────────────────────────────────
    const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.65);
    scene.add(ambientLight);

    // ── Hemisphere Light ──────────────────────────────────────────────────────
    const hemiLight = new THREE.HemisphereLight(0x334466, 0x0a0a0f, 0.2);
    scene.add(hemiLight);

    // ── Spotlight  xPos=2.0, yPos=2.0, zPos=1.0 ──────────────────────────────
    const spotlight = new THREE.SpotLight(0xfff4e0, 10, 15, Math.PI / 5, 0.3, 1.5);
    spotlight.position.set(2.0, 2.0, 1.0);
    spotlight.target.position.set(0, 0, 0.5);
    spotlight.castShadow = true;
    spotlight.shadow.mapSize.width  = 2048;
    spotlight.shadow.mapSize.height = 2048;
    spotlight.shadow.camera.near = 0.2;
    spotlight.shadow.camera.far  = 12;
    spotlight.shadow.bias = -0.001;
    scene.add(spotlight);
    scene.add(spotlight.target);

    // ── GLTF Loader ───────────────────────────────────────────────────────────
    const loader = new GLTFLoader();

    function loadModel(url, x, y, z) {
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          (gltf) => {
            const model = gltf.scene;
            model.position.set(x, y, z);
            // enable shadows on every mesh
            model.traverse((child) => {
              if (child.isMesh) {
                child.castShadow    = true;
                child.receiveShadow = true;
              }
            });
            scene.add(model);
            resolve(model);
          },
          undefined,
          reject
        );
      });
    }

    // Model 1 – car body (single instance)
    loadModel(
      'https://raw.githubusercontent.com/510home/iso-night-drive/main/models/lancer_1x_nowheels.glb',
      -0.07, 0.1, 0
    ).catch(console.error);

    // Model 2 – wheels (two instances)
    loadModel(
      'https://raw.githubusercontent.com/510home/iso-night-drive/master/models/wheels_1x.glb',
       1, 0, 0
    ).catch(console.error);

    loadModel(
      'https://raw.githubusercontent.com/510home/iso-night-drive/master/models/wheels_1x.glb',
      -0.85, 0, 0
    ).catch(console.error);

    // ── Resize handler ────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop ───────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
