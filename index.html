<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THREE.JS — Grass Field</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #a8c247;
      --dark: #202020;
      --off-white: #e8e2d5;
      --accent: #c4a84a;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Space Mono', monospace;
    }

    #canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* ── Overlay UI ── */
    .ui {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      inset: 0;
    }

    /* top-left title block */
    .title-block {
      position: absolute;
      top: 40px;
      left: 48px;
    }

    .title-block .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .title-block h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(2rem, 5vw, 4.5rem);
      color: var(--off-white);
      line-height: 1;
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
    }

    .title-block h1 span {
      color: var(--accent);
    }

    /* bottom-right meta */
    .meta {
      position: absolute;
      bottom: 40px;
      right: 48px;
      text-align: right;
      opacity: 0;
      animation: fadeUp 1s ease 1s forwards;
    }

    .meta p {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(232,226,213,0.35);
      line-height: 2;
    }

    /* bottom-left status dot */
    .status {
      position: absolute;
      bottom: 40px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeUp 1s ease 1.2s forwards;
    }

    .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    .status p {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232,226,213,0.4);
    }

    /* thin vertical rule on far right */
    .rule {
      position: absolute;
      top: 0;
      right: 120px;
      width: 1px;
      height: 100vh;
      background: linear-gradient(to bottom, transparent, rgba(168,194,71,0.15) 30%, rgba(168,194,71,0.15) 70%, transparent);
      opacity: 0;
      animation: fadeIn 2s ease 1.5s forwards;
    }

    /* scan-line vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 5;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(1.4); }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="vignette"></div>

  <script>
    var canvas = document.getElementById("canvas");

    window.onresize = resizeCanvas;
    resizeCanvas();

    var scene = new Scene(canvas);

    render();

    function render() {
      requestAnimationFrame(render);
      scene.update();
    }

    function resizeCanvas() {
      var canvas = document.getElementById("canvas");
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      if (scene) scene.onWindowResize();
    }

    function Scene(canvas) {
      canvas.width = document.body.clientWidth;
      canvas.height = document.body.clientHeight;

      var time = 0;
      var width = canvas.width;
      var height = canvas.height;

      var scene = new THREE.Scene();
      scene.background = new THREE.Color("#002244");

      var light = buildLights(scene);
      var camera = buildCamera(width, height);
      var renderer = buildRender(width, height);
      var mesh = addObjects(scene);
      addSphere(scene);

      // ── OrbitControls ──────────────────────────────────────────
      var controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.screenSpacePanning = false;
      controls.minDistance = 2;
      controls.maxDistance = 60;
      controls.maxPolarAngle = Math.PI / 2;   // don't flip below ground

      // ── WASD movement ──────────────────────────────────────────
      var keys = {};
      window.addEventListener('keydown', function(e) { keys[e.code] = true; });
      window.addEventListener('keyup',   function(e) { keys[e.code] = false; });

      var moveSpeed = 0.08;
      var moveDir   = new THREE.Vector3();
      var right     = new THREE.Vector3();
      var forward   = new THREE.Vector3();

      function applyWASD() {
        // Get camera's horizontal forward/right (ignore Y so we stay at ground level)
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        moveDir.set(0, 0, 0);
        if (keys['KeyW'] || keys['ArrowUp'])    moveDir.add(forward);
        if (keys['KeyS'] || keys['ArrowDown'])  moveDir.sub(forward);
        if (keys['KeyA'] || keys['ArrowLeft'])  moveDir.sub(right);
        if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);

        if (moveDir.lengthSq() > 0) {
          moveDir.normalize().multiplyScalar(moveSpeed);
          camera.position.add(moveDir);
          controls.target.add(moveDir);   // keep orbit pivot travelling with us
        }
      }

      function buildLights(scene) {
        var light = new THREE.SpotLight("#fff", 1);
        light.position.y = 100;
        light.angle = 1.05;
        light.decacy = 2;
        light.penumbra = 1;
        light.shadow.camera.near = 10;
        light.shadow.camera.far = 1000;
        light.shadow.camera.fov = 30;
        scene.add(light);
        return light;
      }

      function buildCamera(width, height) {
        var aspectRatio = width / height;
        var fieldOfView = 60;
        var nearPlane = 1;
        var farPlane = 500;
        var camera = new THREE.PerspectiveCamera(fieldOfView, aspectRatio, nearPlane, farPlane);
        camera.position.z = 10;
        camera.position.y = 2;
        camera.position.x = -1;
        return camera;
      }

      function buildRender(width, height) {
        var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        var DPR = (window.devicePixelRatio) ? window.devicePixelRatio : 1;
        renderer.setPixelRatio(DPR);
        renderer.setSize(width, height);
        return renderer;
      }
 // ── PLANE STREET TEXTURE ──────────────────────────────────────────
      function addObjects(scene) {
        var geometry = new THREE.PlaneGeometry(4, 18);

        var loader = new THREE.TextureLoader();
        var colorMap = loader.load('https://raw.githubusercontent.com/510home/iso-night-drive/main/tex/asphalt01xPortrait.jpg');
        colorMap.wrapS = THREE.RepeatWrapping;
        colorMap.wrapT = THREE.RepeatWrapping;
        colorMap.repeat.set(1, 1);

        var material = new THREE.MeshStandardMaterial({
          map: colorMap,
          transparent: false,
          side: THREE.DoubleSide,
          roughness: 1
        });

       var mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.x = -Math.PI / 2;
        scene.add(mesh);
        return mesh;
      }

      function addSphere(scene) {
        var geometry = new THREE.SphereGeometry(2, 64, 64);
        var material = new THREE.MeshStandardMaterial({ color: "#1a6fd4", roughness: 0.3, metalness: 0.2 });
        var sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(0, -3, 0);
        scene.add(sphere);
        return sphere;
      }

      this.update = function () {
        time++;
        light.position.x = Math.sin(time * 0.01) * 200;
        mesh.material.map.offset.y = time * -0.0075;

        applyWASD();
        controls.update();   // required for damping

        renderer.clear();
        renderer.render(scene, camera);
      };

      this.onWindowResize = function () {
        var canvas = document.getElementById("canvas");
        var width = document.body.clientWidth;
        var height = document.body.clientHeight;
        canvas.width = width;
        canvas.height = height;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      };
    }
  </script>
</body>
</html>
